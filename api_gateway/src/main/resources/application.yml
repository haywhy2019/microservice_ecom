spring:
  application:
    name: api_gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product_service
              uri: http://localhost:8080
              predicates:
                - Path=/api/products/**
              filters:
                - RewritePath=/api/products/(?<segment>.*), /${segment}

            - id: inventory_service
              uri: http://localhost:8082
              predicates:
                - Path=/api/inventory/**
              filters:
                - RewritePath=/api/inventory/(?<segment>.*), /${segment}

            - id: order_service
              uri: http://localhost:8081
              predicates:
                - Path=/api/order/**
              filters:
                - RewritePath=/api/order/(?<segment>.*), /${segment}

server:
  port: 9000
